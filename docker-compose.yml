services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env

volumes:
  caddy_data:
  caddy_config:
