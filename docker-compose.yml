services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on: { backend: { condition: service_healthy } }
    healthcheck: { test: ["CMD","wget","-qO-","http://127.0.0.1:2019/config/"], interval: 30s, timeout: 5s, retries: 3, start_period: 10s }
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    expose: ["3000"]
    healthcheck: { test: ["CMD","wget","-qO-","http://127.0.0.1:3000/api/health"], interval: 30s, timeout: 5s, retries: 3, start_period: 10s }
  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    depends_on: { backend: { condition: service_healthy } }
    healthcheck: { test: ["CMD","test","-f","/tmp/bot-ready"], interval: 30s, timeout: 5s, retries: 3, start_period: 30s }
volumes:
  caddy_data:
  caddy_config:
